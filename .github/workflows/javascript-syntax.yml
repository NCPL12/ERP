name: JavaScript Syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: Check application JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Parse all application JavaScript files
        shell: bash
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! node --check "$file"; then
              failed=1
            fi
          done < <(find src/main/resources/static/js -type f -name '*.js' -print0)

          echo "Checked $count application JavaScript files."
          if (( count == 0 )); then
            echo "No application JavaScript files were found." >&2
            exit 1
          fi
          exit "$failed"
