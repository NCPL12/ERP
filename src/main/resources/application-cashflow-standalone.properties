# Local testing profile for running the Cashflow Analyzer without the ERP shell.
# Activate together with dev and cashflow-test.
server.port=8081
server.servlet.context-path=/
cashflow.standalone=true

# Standalone desktop: TallyPrime runs on this same laptop.
cashflow.tally.server.url=http://127.0.0.1:9000
# Use whichever company Finance currently has open in TallyPrime.
cashflow.tally.company-name=
cashflow.tally.sync.enabled=true
cashflow.tally.sync.initial-delay-ms=5000
cashflow.tally.sync.interval-ms=60000

# Portable standalone database: no MySQL installation or SQL password is required.
spring.datasource.url=jdbc:h2:file:./data/cashflow_db;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Supplied only by the first-run launcher, then removed from its environment.
cashflow.bootstrap-admin.username=${CASHFLOW_BOOTSTRAP_ADMIN_USERNAME:}
cashflow.bootstrap-admin.password=${CASHFLOW_BOOTSTRAP_ADMIN_PASSWORD:}

