spring.profiles.active=@activatedProperties@
tally.po.sync.enabled=true

# Client PO PDFs are stored as blobs; allow files well above Spring's 1MB default
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
# Dashboard snapshot used to refresh every 60s and load all SO rows each time; 5 min keeps memory spikes down
dashboard.counts.refresh-ms=300000
