<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="cashflow-base" th:content="@{/cashflow-analyzer}" />
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:content="${_csrf.headerName}" />
    <script th:src="@{/cashflow-analyzer/js/module-paths.js}"></script>
    <meta charset="UTF-8" />
    <title>Select Mode - Neptune Cash Flow Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .mode-panel {
            width: min(500px, 100% - 2rem);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            animation: fadeInUp .6s ease both;
        }
        .mode-panel h2 {
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .mode-panel .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .mode-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .mode-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .mode-card.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }
        .mode-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }
        .mode-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .mode-description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.4;
        }
        .btn-primary {
            background: linear-gradient(90deg,#ec4899,#d946ef);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 12px 24px;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg,#d946ef,#ec4899);
        }
        @keyframes fadeInUp {
            from {opacity:0; transform: translateY(18px);}
            to {opacity:1; transform: translateY(0);}
        }
    </style>
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('neptuneColorTheme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));</script>
    <link rel="stylesheet" th:href="@{/cashflow-analyzer/css/app-theme.css?v=20260825-table-alignment}">
</head>
<body>
    <div class="mode-panel">
        <div style="display:flex; align-items:center; justify-content:center; margin-bottom:12px; gap:12px;">
            <img th:src="@{/cashflow-analyzer/images/neptune-logo.ico}" alt="Neptune" style="width: 38px; height: 38px; border-radius: 8px; background: rgba(255,255,255,0.15); padding: 3px;" />
            <h2>Neptune Access</h2>
        </div>

        <p class="subtitle">Choose your data integration mode</p>

        <form th:action="@{/select-mode}" method="post" id="modeForm">
            <a href="#" class="mode-card" data-mode="EXCEL" onclick="selectMode('EXCEL')">
                <i class="fas fa-file-excel mode-icon" style="color: #217346;"></i>
                <div class="mode-title">Excel Mode</div>
                <div class="mode-description">
                    Upload and analyze Excel files manually. Perfect for ad-hoc analysis and custom data imports.
                </div>
            </a>

            <input type="hidden" name="selectedMode" id="selectedMode" value="EXCEL" />

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary" id="continueBtn" disabled>
                    Continue to Login
                </button>
            </div>
        </form>
    </div>

    <script>
        let selectedMode = null;

        function selectMode(mode) {
            selectedMode = mode;
            document.getElementById('selectedMode').value = mode;

            // Update UI
            document.querySelectorAll('.mode-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');

            // Enable continue button
            document.getElementById('continueBtn').disabled = false;
        }

        // Default to Excel mode and pre-select when page loads
        window.addEventListener('DOMContentLoaded', function() {
            selectedMode = 'EXCEL';
            document.getElementById('selectedMode').value = 'EXCEL';
            selectMode('EXCEL');
        });
    </script>
<script th:src="@{/cashflow-analyzer/js/app-theme.js?v=20260924-erp-navigation-2}"></script>
</body>
</html>
